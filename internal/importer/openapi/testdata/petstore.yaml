openapi: "3.0.3"
info:
  title: Petstore
  version: "1.0"
servers:
  - url: https://petstore.example.com/api/
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    NewPet:
      type: object
      properties:
        name:
          type: string
          example: Rex
        age:
          type: integer
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [available, pending, sold]
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            default: 20
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ok
    post:
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: created
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: integer
          example: 7
    get:
      operationId: getPet
      responses:
        "200":
          description: ok
    delete:
      operationId: deletePet
      responses:
        "204":
          description: deleted
